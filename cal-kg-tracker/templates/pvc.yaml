{{- if hasKey .Values.database.sqlite "persistence" }}
{{- fail "database.sqlite.persistence has moved to persistence. Move your values there to keep using the same volume." }}
{{- end }}
{{- with .Values.integrations.fatsecret }}
{{- if and (or .existingSecret (and .consumerKey .consumerSecret)) (not $.Values.persistence.enabled) (not .allowWithoutPersistence) }}
{{- fail "integrations.fatsecret requires persistence.enabled=true: the keys that encrypt its token must be kept on a volume. Set integrations.fatsecret.allowWithoutPersistence=true to deploy anyway." }}
{{- end }}
{{- end }}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cal-kg-tracker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cal-kg-tracker.labels" . | nindent 4 }}
spec:
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  accessModes:
    - {{ .Values.persistence.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
